services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/finance_tracker.db
      JWT_SECRET: ${JWT_SECRET:?serve un JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?serve una ADMIN_PASSWORD}
    volumes:
      - data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
